name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 0"

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOWORK: off

jobs:
  parsers:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: scripts/verify.sh fuzz
      - run: scripts/verify.sh depth
